<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relatório Bike Fit — Custom Bike Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#0E1211; --paper:#fff; --rule:#DCE0DF; --rule-strong:#0E1211;
  --muted:#6C7573; --soft:#F4F6F5;
  --brand:#183D2C; --brand-2:#183D2C20; --coral:#F88379; --accent:#0E7BC0;
  --font-d:'Archivo',system-ui,sans-serif;
  --font-b:'DM Sans',system-ui,sans-serif;
  --font-m:'IBM Plex Mono',ui-monospace,monospace;
  --zoom:.62;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font-b);color:var(--ink);background:#E9ECEA;font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}

/* ───────── app chrome ───────── */
.appbar{position:sticky;top:0;z-index:40;display:flex;gap:14px;align-items:center;
  background:var(--brand);color:#F2F5F3;padding:10px 16px;border-bottom:2px solid #000}
.mark{width:28px;height:28px;border-radius:7px;background:#fff;display:grid;place-items:center;padding:3px}
.mark img{width:100%;height:100%;object-fit:contain}
.brandname{font-family:var(--font-d);font-weight:600;letter-spacing:-.02em;font-size:15px}
.brandname small{display:block;font-family:var(--font-m);font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;color:#8FA79A;font-weight:500}
.appbar .sp{flex:1}
.btn{background:#22513B;border:1px solid #2E6349;color:#EAF0EC;padding:7px 13px;border-radius:7px;
  cursor:pointer;font-size:13px;font-weight:500;transition:.15s}
.btn:hover{background:#2C6146;border-color:var(--coral)}
.btn.primary{background:var(--coral);border-color:var(--coral);color:#2A0F0C;font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,
.drop:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
.zoom{display:flex;align-items:center;gap:6px;font-family:var(--font-m);font-size:11px;color:#8FA79A}

.split{display:grid;grid-template-columns:minmax(380px,44%) 1fr;height:calc(100vh - 47px)}
.editor{overflow:auto;background:#fff;border-right:1px solid #C9CFCC;padding-bottom:60px}
.preview{overflow:auto;padding:26px 0 60px;display:flex;justify-content:center;align-items:flex-start}

/* ───────── editor ───────── */
.jump{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--rule);
  padding:9px 16px;display:flex;gap:6px;flex-wrap:wrap}
.jump a{font-family:var(--font-m);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  text-decoration:none;color:var(--muted);border:1px solid var(--rule);padding:4px 8px;border-radius:20px}
.jump a:hover{color:var(--ink);border-color:var(--ink)}
section.sec{padding:22px 16px;border-bottom:1px solid var(--rule);scroll-margin-top:52px}
.sec > h2{font-family:var(--font-d);font-size:15px;font-weight:600;letter-spacing:-.01em;margin:0 0 3px}
.sec > p.hint{margin:0 0 16px;color:var(--muted);font-size:12.5px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:11px}
.f{display:flex;flex-direction:column;gap:5px}
.f label{font-family:var(--font-m);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.f input,.f select,.f textarea{width:100%;padding:8px 9px;border:1px solid #CFD5D3;border-radius:6px;
  background:#fff;font-size:13.5px}
.f textarea{min-height:74px;resize:vertical;line-height:1.5}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid #CFD5D3;background:#fff;border-radius:20px;padding:6px 13px;font-size:12.5px;cursor:pointer;transition:.13s}
.chip:hover{border-color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.w2{grid-column:span 2}.w3{grid-column:span 3}.w4{grid-column:span 4}
.w6{grid-column:span 6}.w8{grid-column:span 8}.w12{grid-column:span 12}
@media(max-width:1150px){.w2,.w3,.w4{grid-column:span 6}}

/* image drop */
.drop{grid-column:span 6;border:1.5px dashed #C4CBC8;border-radius:9px;padding:12px;cursor:pointer;
  display:flex;gap:11px;align-items:center;background:#FBFCFB;transition:.15s}
.drop:hover,.drop.over{border-color:var(--ink);background:#F3F6F4}
.drop .th{width:62px;height:62px;flex:none;border-radius:6px;background:#EDF0EE;display:grid;place-items:center;
  overflow:hidden;font-family:var(--font-m);font-size:9px;color:#9AA3A0}
.drop .th img{width:100%;height:100%;object-fit:cover}
.drop b{display:block;font-family:var(--font-d);font-size:13px;font-weight:600}
.drop span{font-size:11.5px;color:var(--muted)}
.drop .rm{margin-left:auto;border:none;background:none;color:var(--muted);cursor:pointer;font-size:17px;padding:4px 8px}
.drop .rm:hover{color:#C0392B}

/* editable tables */
table.ed{width:100%;border-collapse:collapse;margin-top:4px}
table.ed th{font-family:var(--font-m);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);text-align:left;font-weight:500;padding:0 6px 6px}
table.ed td{padding:2px 3px}
table.ed input{width:100%;padding:6px 8px;border:1px solid #CFD5D3;border-radius:5px;font-size:13px}
table.ed input.num{font-family:var(--font-m);text-align:right}
table.ed .x{border:none;background:none;color:#B3BBB8;cursor:pointer;font-size:16px;padding:2px 6px}
table.ed .x:hover{color:#C0392B}
.addrow{margin-top:9px;background:#fff;border:1px dashed #C4CBC8;color:var(--muted);
  padding:7px 12px;border-radius:6px;cursor:pointer;font-size:12.5px;width:100%}
.addrow:hover{border-color:var(--ink);color:var(--ink)}
.rec{display:grid;grid-template-columns:1fr 120px 30px;gap:7px;margin-bottom:7px;align-items:start}
.rec textarea{min-height:58px}

/* ───────── report paper ───────── */
.stack{transform:scale(var(--zoom));transform-origin:top center}
.page{width:210mm;min-height:297mm;background:var(--paper);color:var(--ink);
  padding:15mm 15mm 14mm;margin:0 auto 16px;position:relative;display:flex;flex-direction:column;
  box-shadow:0 2px 22px #0002}
.page .ph{display:flex;justify-content:space-between;align-items:baseline;
  border-bottom:2.5px solid var(--ink);padding-bottom:5px;margin-bottom:9mm}
.ph h3{font-family:var(--font-d);font-size:12.5pt;font-weight:600;letter-spacing:-.01em;margin:0}
.ph .who{font-family:var(--font-m);font-size:7.5pt;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.pf{margin-top:auto;padding-top:5mm;border-top:1px solid var(--rule);display:flex;
  justify-content:space-between;align-items:flex-end;font-family:var(--font-m);font-size:7pt;color:var(--muted)}
.pf .lg{display:flex;align-items:center;gap:7px}
.pf .lg img{height:6mm;width:auto;display:block}
.pf .lg span{font-family:var(--font-d);font-size:8pt;font-weight:600;letter-spacing:-.02em;color:var(--ink)}
.pnum{font-family:var(--font-m);font-size:7pt}

/* cover */
.cover{justify-content:flex-start;padding:20mm 15mm 16mm}
.cover .top{display:flex;justify-content:space-between;align-items:flex-start}
.cover .logo{width:26mm}
.cover .logo img{width:100%;height:auto;display:block}
.cover .ref{font-family:var(--font-m);font-size:8pt;text-align:right;line-height:1.7;color:var(--muted)}
.cover h1{font-family:var(--font-d);font-weight:700;font-size:44pt;line-height:.94;letter-spacing:-.035em;
  margin:0 0 6mm;max-width:15ch}
.cover h1 em{font-style:normal;color:var(--muted)}
.cover .lead{font-size:11pt;max-width:52ch;line-height:1.55;color:#3B4341}
.cover .who{margin-top:9mm;display:flex;gap:0;flex-wrap:wrap;border-top:2.5px solid var(--ink);padding-top:5mm}
.cover .who div{padding-right:14mm}
.cover .who dt{font-family:var(--font-m);font-size:7.5pt;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);margin-bottom:3px}
.cover .who dd{margin:0;font-family:var(--font-d);font-size:14pt;font-weight:600;letter-spacing:-.01em}
.blueprint{margin:12mm 0 0;opacity:.75}
.blueprint svg{width:100%;height:auto;display:block}
.cover .blueprint{margin-top:auto}
.cover .pf{}

/* content blocks */
.page h4{font-family:var(--font-d);font-size:10.5pt;font-weight:600;margin:0 0 4px;letter-spacing:-.01em}
.page p{font-size:9.7pt;line-height:1.55;margin:0 0 3.5mm;color:#232A28}
.eyebrow{font-family:var(--font-m);font-size:7.5pt;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);margin:0 0 3mm;display:flex;align-items:center;gap:8px;
  break-after:avoid;page-break-after:avoid}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--rule)}
.pbody>*+.eyebrow{margin-top:7mm}
.pbody>p{margin:0 0 3.5mm}
.pbody>table.rp,.pbody>.antro,.pbody>.shots,.pbody>.bikeimg,.pbody>.tags,.pbody>.note{margin-bottom:4mm}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9mm}

/* measurement flags — signature element */
.antro{display:grid;grid-template-columns:36mm 1fr;gap:8mm;align-items:start}
.antro .fig{border:1px solid var(--rule);border-radius:5px;padding:3mm 2mm;background:#fff}
.antro .fig img{width:100%;height:auto;max-height:92mm;object-fit:contain;display:block}
.mlist{list-style:none;margin:0;padding:0}
.mlist li{display:flex;align-items:center;gap:4mm;padding:2.5mm 0;border-bottom:1px solid var(--rule)}
.mlist li:first-child{border-top:2px solid var(--ink)}
.mlist b{font-family:var(--font-m);font-size:7.5pt;width:6mm;height:6mm;flex:none;display:grid;
  place-items:center;border:1px solid var(--ink);border-radius:50%;font-weight:500}
.mlist span{flex:1;font-size:9.5pt}
.mlist em{font-style:normal;font-family:var(--font-m);font-size:9pt;font-weight:600;
  background:var(--ink);color:#fff;padding:2.5px 8px;border-radius:3px;white-space:nowrap}
.tags{display:flex;flex-wrap:wrap;gap:5px 6px}
.tag{display:inline-flex;align-items:stretch;border-radius:4px;overflow:hidden;border:1px solid var(--ink)}
.tag .k{padding:4px 7px;font-family:var(--font-m);font-size:7pt;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink);background:#fff;display:flex;align-items:center}
.tag .v{padding:4px 8px;font-family:var(--font-m);font-size:8.5pt;font-weight:600;background:var(--ink);
  color:#fff;display:flex;align-items:center;white-space:nowrap}
.tag.lite .v{background:#fff;color:var(--ink);border-left:1px solid var(--ink)}

/* data tables */
table.rp{width:100%;border-collapse:collapse;font-size:9.3pt}
table.rp thead{display:table-header-group}
table.rp tr{break-inside:avoid;page-break-inside:avoid}
.r,.shot,.antro,.mlist li{break-inside:avoid;page-break-inside:avoid}
table.rp th{font-family:var(--font-m);font-size:7.5pt;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);font-weight:500;text-align:right;padding:0 0 5px;border-bottom:1.5px solid var(--ink)}
table.rp th:first-child{text-align:left}
table.rp td{padding:6px 0;border-bottom:1px solid var(--rule);text-align:right;font-family:var(--font-m);
  font-size:9pt}
table.rp td:first-child{text-align:left;font-family:var(--font-b);font-size:9.3pt}
table.rp td.was{color:var(--muted)}
table.rp td.now b{background:var(--ink);color:#fff;padding:2.5px 7px;border-radius:3px;font-weight:600}
.delta{font-family:var(--font-m);font-size:7.5pt;border:1px solid var(--accent);color:var(--accent);
  border-radius:3px;padding:1.5px 5px}
.delta.zero{border-color:var(--rule);color:var(--muted)}

/* images */
.shots{display:grid;grid-template-columns:1fr 1fr;gap:8mm}
.shot figcaption{font-family:var(--font-m);font-size:7.5pt;letter-spacing:.13em;text-transform:uppercase;
  margin-bottom:3mm;display:flex;align-items:center;gap:7px}
.shot figcaption b{background:var(--ink);color:#fff;padding:2px 7px;border-radius:3px;font-weight:600;letter-spacing:.1em}
.shot{margin:0}
.shot .box{border:1px solid var(--rule);border-radius:5px;overflow:hidden;background:var(--soft);
  aspect-ratio:4/5;display:grid;place-items:center}
.shot .box img{width:100%;height:100%;object-fit:contain;display:block}
.shot .box.wide{aspect-ratio:3/4}
.ph-empty{font-family:var(--font-m);font-size:7.5pt;color:#A9B1AE;text-align:center;padding:8px}
.bikeimg{border:1px solid var(--rule);border-radius:5px;overflow:hidden;background:#fff;margin-bottom:6mm}
.bikeimg img{width:100%;height:auto;max-height:96mm;object-fit:contain;display:block}

/* recommendations */
.r{display:flex;gap:6mm;padding:4mm 0;border-bottom:1px solid var(--rule);align-items:flex-start}
.r.rtop{border-top:2.5px solid var(--ink)}
.r .n{font-family:var(--font-m);font-size:8pt;color:var(--muted);width:22px;flex:none;padding-top:2px}
.r .t{flex:1;font-size:9.5pt;line-height:1.5}
.r .t b{display:block;font-family:var(--font-d);font-size:10pt;margin-bottom:2px}
.st{font-family:var(--font-m);font-size:7pt;letter-spacing:.11em;padding:3px 8px;border-radius:3px;
  border:1px solid var(--ink);white-space:nowrap;margin-top:2px}
.st.a{background:var(--ink);color:#fff}
.st.r{border-color:#B9C0BD;color:#8A928F}
.link{font-family:var(--font-m);font-size:8pt;color:var(--accent);word-break:break-all}
.note{background:var(--soft);border-left:2.5px solid var(--ink);padding:4mm 5mm;font-size:9.3pt;line-height:1.55}

@media(max-width:900px){
  .split{grid-template-columns:1fr;height:auto}
  .preview{display:none}
  body.showprev .editor{display:none}
  body.showprev .preview{display:flex}
}

@media print{
  @page{size:A4;margin:0}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  html,body{height:auto!important;overflow:visible!important;background:#fff!important}
  .appbar,.editor,.jump{display:none!important}
  .split{display:block!important;height:auto!important}
  .preview{overflow:visible!important;padding:0!important;display:block!important}
  .stack{transform:none!important;width:auto!important}
  .page{box-shadow:none!important;margin:0!important;break-after:page;page-break-after:always}
  .page:last-child{break-after:auto;page-break-after:auto}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="appbar">
  <div class="mark"><img src="" id="barmark" alt=""></div>
  <div class="brandname">custom bike lab<small>gerador de relatório · bike fit</small></div>
  <div class="sp"></div>
  <div class="zoom">
    <button class="btn" id="zout" title="Reduzir">−</button><span id="zval">62%</span>
    <button class="btn" id="zin" title="Aumentar">+</button>
  </div>
  <button class="btn" id="demo">Exemplo</button>
  <button class="btn" id="clear">Limpar</button>
  <button class="btn" id="open">Abrir…</button>
  <button class="btn" id="save">Guardar dados</button>
  <button class="btn" id="dl">Descarregar relatório</button>
  <button class="btn primary" id="print">Imprimir / PDF</button>
  <input type="file" id="jsonin" accept="application/json" hidden>
</div>

<div class="split">
  <div class="editor">
    <nav class="jump" id="jump"></nav>
    <div id="form"></div>
  </div>
  <div class="preview"><div class="stack" id="stack"></div></div>
</div>

/* ═══════════ construir formulário ═══════════ */
const el=(h)=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild};
const esc=(s)=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nl=(s)=>esc(s).replace(/\n/g,'<br>');
const form=document.getElementById('form'), jump=document.getElementById('jump');

SCHEMA.forEach(sec=>{
  jump.appendChild(el(`<a href="#s-${sec.id}">${sec.t}</a>`));
  const box=el(`<section class="sec" id="s-${sec.id}"><h2>${sec.t}</h2>${sec.h?`<p class="hint">${sec.h}</p>`:''}<div class="grid"></div></section>`);
  const g=box.querySelector('.grid');
  sec.f.forEach(([k,l,t,w])=>{
    if(t==='img'){ g.appendChild(dropzone(k.slice(4),l,w)); return; }
    if(t==='tbl'){ g.appendChild(tableBlock(k.slice(4),w)); return; }
    if(t==='recs'){ g.appendChild(recsBlock(w)); return; }
    if(t.startsWith('multi:')){ g.appendChild(multiBlock(k,l,SEL[t.slice(6)],w)); return; }
    let inner;
    if(t==='area') inner=`<textarea data-k="${k}"></textarea>`;
    else if(t.startsWith('sel:')){
      const o=SEL[t.slice(4)].map(v=>`<option>${esc(v)}</option>`).join('');
      inner=`<select data-k="${k}"><option value="">—</option>${o}</select>`;
    } else inner=`<input data-k="${k}" type="${t==='num'?'number':t==='date'?'date':'text'}"${t==='num'?' step="any"':''}>`;
    g.appendChild(el(`<div class="f ${w}"><label>${l}</label>${inner}</div>`));
  });
  form.appendChild(box);
});

form.addEventListener('input',e=>{
  const k=e.target.dataset.k; if(!k) return;
  S.meta[k]=e.target.value; render();
});

/* escolha múltipla em chips */
function multiBlock(key,label,opts,w){
  const wrap=el(`<div class="f ${w}" data-multi="${key}"><label>${label}</label><div class="chips"></div></div>`);
  const box=wrap.querySelector('.chips');
  opts.forEach(o=>{const b=el(`<button type="button" class="chip">${esc(o)}</button>`);b.dataset.v=o;box.appendChild(b)});
  const paint=()=>{ const cur=(S.meta[key]||'').split(' · ');
    box.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',cur.includes(c.dataset.v))); };
  box.addEventListener('click',e=>{
    const b=e.target.closest('.chip'); if(!b) return;
    const cur=new Set((S.meta[key]||'').split(' · ').filter(Boolean));
    cur.has(b.dataset.v)?cur.delete(b.dataset.v):cur.add(b.dataset.v);
    S.meta[key]=opts.filter(o=>cur.has(o)).join(' · ');
    paint(); render();
  });
  wrap._paint=paint; return wrap;
}

/* zona de imagem */
function dropzone(key,label,w){
  const d=el(`<div class="drop ${w}" tabindex="0" role="button">
    <div class="th" data-th>sem imagem</div>
    <div><b>${label}</b><span>Clicar ou arrastar · JPG/PNG</span></div>
    <button class="rm" title="Remover" hidden>×</button>
    <input type="file" accept="image/*" hidden></div>`);
  const inp=d.querySelector('input'), th=d.querySelector('[data-th]'), rm=d.querySelector('.rm');
  const load=f=>{ if(!f||!f.type.startsWith('image/'))return;
    const r=new FileReader(); r.onload=()=>{S.img[key]=r.result;paint();render()}; r.readAsDataURL(f); };
  const paint=()=>{ const v=S.img[key];
    th.innerHTML = v?`<img src="${v}" alt="">`:'sem imagem'; rm.hidden=!v; };
  d.addEventListener('click',e=>{ if(e.target!==rm) inp.click(); });
  d.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();inp.click()} });
  d.addEventListener('dragover',e=>{e.preventDefault();d.classList.add('over')});
  d.addEventListener('dragleave',()=>d.classList.remove('over'));
  d.addEventListener('drop',e=>{e.preventDefault();d.classList.remove('over');load(e.dataTransfer.files[0])});
  inp.addEventListener('change',()=>load(inp.files[0]));
  rm.addEventListener('click',()=>{delete S.img[key];paint();render()});
  d.dataset.img=key; d._paint=paint; return d;
}

/* tabelas editáveis */
function tableBlock(which,w){
  const wrap=el(`<div class="${w}" data-tbl="${which}"></div>`); drawTable(wrap,which); return wrap;
}
function drawTable(wrap,which){
  const rows=S[which], lbl=['Medida','Antes','Final'];
  wrap.innerHTML=`<table class="ed"><thead><tr>
      <th style="width:46%">${lbl[0]}</th><th style="width:20%">${lbl[1]}</th>
      <th style="width:20%">${lbl[2]}</th><th style="width:9%">Un.</th><th></th></tr></thead>
    <tbody>${rows.map((r,i)=>`<tr>
      <td><input value="${esc(r.n)}" data-r="${i}" data-c="n"></td>
      <td><input class="num" value="${esc(r.a)}" data-r="${i}" data-c="a"></td>
      <td><input class="num" value="${esc(r.b)}" data-r="${i}" data-c="b"></td>
      <td><input class="num" value="${esc(r.u)}" data-r="${i}" data-c="u"></td>
      <td><button class="x" data-del="${i}" title="Remover">×</button></td></tr>`).join('')}
    </tbody></table><button class="addrow">+ adicionar linha</button>`;
  wrap.oninput=e=>{const t=e.target; if(t.dataset.c!==undefined){rows[t.dataset.r][t.dataset.c]=t.value;render()}};
  wrap.onclick=e=>{
    if(e.target.dataset.del!==undefined){rows.splice(+e.target.dataset.del,1);drawTable(wrap,which);render()}
    if(e.target.classList.contains('addrow')){rows.push({n:'',u:'mm',a:'',b:''});drawTable(wrap,which);
      wrap.querySelectorAll('input[data-c="n"]').forEach((x,i,arr)=>{if(i===arr.length-1)x.focus()});render()}
  };
}
/* recomendações */
function recsBlock(w){ const wrap=el(`<div class="${w}" data-recs></div>`); drawRecs(wrap); return wrap; }
function drawRecs(wrap){
  wrap.innerHTML=`<label style="font-family:var(--font-m);font-size:10px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--muted);display:block;margin-bottom:7px">Recomendações</label>
    ${S.recs.map((r,i)=>`<div class="rec">
      <textarea data-i="${i}" placeholder="Título na 1.ª linha; descrição nas seguintes">${esc(r.t)}</textarea>
      <select data-i="${i}" data-s>${['ACEITE','RECUSADO','PENDENTE','A REAVALIAR'].map(o=>
        `<option${r.s===o?' selected':''}>${o}</option>`).join('')}</select>
      <button class="x" data-del="${i}">×</button></div>`).join('')}
    <button class="addrow">+ adicionar recomendação</button>`;
  wrap.querySelectorAll('textarea,select').forEach(x=>x.style.cssText+='padding:8px 9px;border:1px solid #CFD5D3;border-radius:6px;font-size:13px;width:100%');
  wrap.oninput=e=>{const i=e.target.dataset.i; if(i===undefined)return;
    if(e.target.hasAttribute('data-s'))S.recs[i].s=e.target.value; else S.recs[i].t=e.target.value; render()};
  wrap.onclick=e=>{
    if(e.target.dataset.del!==undefined){S.recs.splice(+e.target.dataset.del,1);drawRecs(wrap);render()}
    if(e.target.classList.contains('addrow')){S.recs.push({t:'',s:'ACEITE'});drawRecs(wrap);render()}};
}

const g=k=>(S.meta[k]??'').toString().trim();
const has=(...k)=>k.some(x=>g(x)!=='');
function dataPT(v){ if(!v)return'—'; const [y,m,d]=v.split('-');
  const M=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  return `${+d} de ${M[+m-1]} de ${y}`; }
function tag(k,v,u='mm',lite){ if(!v)return''; return `<span class="tag${lite?' lite':''}">
  <span class="k">${esc(k)}</span><span class="v">${esc(v)}${u?' '+u:''}</span></span>`; }
function delta(a,b){ const x=parseFloat(String(a).replace(',','.')), y=parseFloat(String(b).replace(',','.'));
  if(isNaN(x)||isNaN(y))return''; const d=Math.round((y-x)*100)/100;
  return `<span class="delta${d===0?' zero':''}">${d>0?'+':''}${String(d).replace('.',',')}</span>`; }
function head(title){ return `<div class="ph"><h3>${title}</h3>
  <div class="who">${esc(g('nome')||'—')} · ${dataPT(g('data'))}</div></div>`; }
function foot(){
  return `<div class="pf"><div class="lg"><img src="${S.img.logo||LOGO_MARK}" alt=""><span>custom bike lab</span></div>
    <div>${esc(g('email')||'info@cbikelab.com')} · ${esc(g('tel')||'938762893')}</div>
    <div class="pnum"></div></div>`; }
function page(title,body){ return `<div class="page" data-t="${esc(title)}">${head(title)}<div class="pbody">${body}</div>${foot()}</div>`; }
function block(eyebrow,body){ return `<p class="eyebrow">${eyebrow}</p>${body}`; }
function para(...parts){ const t=parts.filter(Boolean).join(' '); return t?`<p>${nl(t)}</p>`:''; }
function shot(cap,key,ratio){ return `<figure class="shot"><figcaption><b>${cap}</b></figcaption>
  <div class="box ${ratio||''}">${S.img[key]?`<img src="${S.img[key]}" alt="${cap}">`
    :`<div class="ph-empty">sem imagem carregada</div>`}</div></figure>`; }
function rows(list){ return list.filter(r=>r.n&&(r.a||r.b)); }
function tableRP(list,lbl){ return tableRows(rows(list),lbl); }
function tableRows(rs,lbl){ if(!rs.length)return'';
  return `<table class="rp"><thead><tr><th>${lbl[0]}</th><th>${lbl[1]}</th><th>${lbl[2]}</th><th>Δ</th></tr></thead>
  <tbody>${rs.map(r=>`<tr><td>${esc(r.n)}</td>
    <td class="was">${r.a?esc(r.a)+' '+esc(r.u||''):'—'}</td>
    <td class="now">${r.b?`<b>${esc(r.b)} ${esc(r.u||'')}</b>`:'—'}</td>
    <td>${delta(r.a,r.b)}</td></tr>`).join('')}</tbody></table>`; }

    ['·','Largura do pé','larguraPe']];
  const lista=ANTRO.map(([k,l,key])=>{const v=g(key||k);
    return v?`<li><b>${k}</b><span>${esc(l)}</span><em>${esc(v)} mm</em></li>`:''}).join('');
  const antro=lista?`<div class="antro">

      (est||g('estNota')?block('Avaliação estática',para(est)+para(g('estNota'))):'')+

      (mob||g('mobNota')?block('Mobilidade e flexibilidade',para(mob)+para(g('mobNota'))):'')+
      (has('dismetria','dismNota','dismValor')?block('Dismetrias',
        para(g('dismetria'))+ (g('dismValor')?`<div class="tags">${tag('Diferença estimada',g('dismValor'))}</div>`:'')
        +para(g('dismNota'))):'')
    ));

  /* podal */
  const pe=[g('peAlinha')&&g('peAlinha')!=='Neutro'?`Antepé em ${g('peAlinha').toLowerCase()}${g('peGraus')?' de '+g('peGraus')+'°':''}`
      :g('peAlinha')?'Antepé neutro':'',
    g('peCarater')?`com carácter ${g('peCarater').toLowerCase()}`:''].filter(Boolean).join(' ');
  const peMob=[g('peTibio')?`Articulação tíbio-perónio-astragaliana: ${g('peTibio').toLowerCase()}.`:'',
    g('peM1')?`Primeiro raio (M1): ${g('peM1').toLowerCase()}.`:''].filter(Boolean).join(' ');
  const peTags=[tag('Comp. esq.',g('peCompE')),tag('Comp. dir.',g('peCompD')),
    tag('Largura esq.',g('peLargE')),tag('Largura dir.',g('peLargD')),
    tag('Arco esq.',g('arcoE')),tag('Arco dir.',g('arcoD')),
    g('colapso')?tag('Colapso em carga',g('colapso'),''):''].join('');
  if(pe||peMob||peTags||has('peNota','palmilha'))
    P.push(page('Avaliação podal',
      (pe||peMob?block('Alinhamento e mobilidade',para(pe?pe+'.':'')+para(peMob)):'')+
      (peTags?block('Morfologia e dimensões',`<div class="tags">${peTags}</div>`):'')+
      (g('palmilha')?block('Suporte aplicado',para(g('palmilha'))):'')+
      (g('peNota')?block('Notas',para(g('peNota'))):'')
    ));

  /* cinemática */
  if(S.img.cinAntes||S.img.cinDepois||g('cinNota'))
    P.push(page('Cinemática em carga',
      `<div class="shots">${shot('antes','cinAntes')}${shot('depois','cinDepois')}</div>`+
      (g('cinNota')?block('Leitura da cinemática',para(g('cinNota'))):'')
    ));

  if(S.img.mapAntes||S.img.mapDepois||has('mapNota','selimModelo','selimTeste'))

        <div class="tags">${g('selimModelo')?tag('Selim final',g('selimModelo'),'',1):''}
        ${g('selimTeste')?tag('Testados',g('selimTeste'),'',1):''}</div>`:'')+
      (g('mapNota')?block('Leitura',para(g('mapNota'))):'')
    ));

  const medRows=rows(S.medidas);
  const tituloBike=`Bicicleta${g('bikeMarca')?' · '+esc(g('bikeMarca')):''}${g('bikeTam')?', tam. '+esc(g('bikeTam')):''}`;

    /* quantas linhas cabem na primeira folha depende do que está acima delas */
    const cabeNa1a = S.img.bike ? 5 : 17, porFolha = 20;
    const blocos=[];
    if(medRows.length){
      blocos.push(medRows.slice(0,cabeNa1a));
      for(let i=cabeNa1a;i<medRows.length;i+=porFolha) blocos.push(medRows.slice(i,i+porFolha));
    } else blocos.push([]);

      const ultimo = i===blocos.length-1;
      const cabecalho = i===0
        ? (S.img.bike?`<div class="bikeimg"><img src="${S.img.bike}" alt="Esquema da bicicleta"></div>`:'')+

        (bloco.length?`<p class="eyebrow">Cotas · antes e depois${
          i>0?' · cont.':''}</p>${tableRows(bloco,['Medida','Antes','Final'])}`:'')+
        (ultimo&&g('bikeNota')?block('Alterações efectuadas',para(g('bikeNota'))):'')
      ));
    });
  }

  /* resumo */
  const recs=S.recs.filter(r=>r.t.trim());
  const flexTxt=g('flexGlobal')?`Da avaliação funcional realizada, os níveis de flexibilidade e mobilidade
    situam-se num patamar ${g('flexGlobal').toLowerCase()} — aspecto relevante tendo em conta o contexto desportivo.`:'';
  P.push(page('Resumo geral',
    (flexTxt||g('posicaoNota')||g('resumo')?block('Leitura da sessão',
      para(flexTxt)+para(g('posicaoNota'))+para(g('resumo'))):'')+

      ${recs.map((r,i)=>{const [t0,...rest]=r.t.split('\n');
        return `<div class="r${i===0?' rtop':''}"><div class="n">${String(i+1).padStart(2,'0')}</div>
        <div class="t"><b>${esc(t0)}</b>${rest.length?nl(rest.join('\n')):''}</div>
        <div class="st ${r.s==='ACEITE'?'a':r.s==='RECUSADO'?'r':''}">${esc(r.s)}</div></div>`}).join('')}`:'')+
    (has('linkAlong','linkFlex')?`<p class="eyebrow">Rotinas aconselhadas</p>
      ${g('linkAlong')?`<p>Rotina de alongamentos<br><span class="link">${esc(g('linkAlong'))}</span></p>`:''}
      ${g('linkFlex')?`<p>Desenvolvimento e manutenção da flexibilidade<br><span class="link">${esc(g('linkFlex'))}</span></p>`:''}`:'')+
    (g('fecho')?`<div class="note">${nl(g('fecho'))}</div>`:'')
  ));

  const stack=document.getElementById('stack');
  stack.innerHTML=P.join('');
  numerar();
  esperarImagens().then(reflow);
}

const MM=96/25.4;
function numerar(){
  const pn=document.querySelectorAll('#stack .pnum'), n=pn.length;
  pn.forEach((x,i)=>x.textContent=`${String(i+1).padStart(2,'0')} / ${String(n).padStart(2,'0')}`);
}
function esperarImagens(){
  const imgs=[...document.querySelectorAll('#stack img')].filter(i=>!i.complete);
  if(!imgs.length) return Promise.resolve();
  return Promise.all(imgs.map(i=>new Promise(r=>{i.addEventListener('load',r,{once:true});
    i.addEventListener('error',r,{once:true})}))).then(()=>{});
}
/* mede a altura real de cada folha; o que não couber desce para uma folha de continuação */
const FOLHA=Math.round(297*MM);
function reflow(){
  const stack=document.getElementById('stack');
  let voltas=0;
  for(let i=0;i<stack.children.length && voltas<80;i++){
    const pg=stack.children[i];
    if(pg.classList.contains('cover')) continue;
    const corpo=pg.querySelector('.pbody'); if(!corpo) continue;
    if(pg.offsetHeight<=FOLHA || corpo.children.length<2) continue;
    const nova=pg.cloneNode(false);
    nova.innerHTML=pg.innerHTML;
    const tit=(pg.dataset.t||'').replace(/\s*\((cont\.|continuação)\)$/,'');
    nova.dataset.t=tit+' (cont.)';
    nova.querySelector('.ph h3').textContent=tit+' (cont.)';
    const corpoNovo=nova.querySelector('.pbody'); corpoNovo.innerHTML='';
    pg.after(nova);
    let guarda=0;
    while(pg.offsetHeight>FOLHA && corpo.children.length>1 && guarda++<40){
      corpoNovo.prepend(corpo.lastElementChild);
    }
    voltas++;
  }
  numerar();
}
